name: COMMERCA Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Verify FFmpeg
        run: ffmpeg -version
      - name: Core tests (no external providers)
        run: npm test
      - name: Stage 10 Production real MP4 render test
        run: node --import tsx --test test/production.render.e2e.test.ts
      - name: Stage 11 QC real MP4 gate
        run: node --import tsx --test test/qc.final-mp4.e2e.test.ts
      - name: Stage 12 Publishing gate
        run: node --import tsx --test test/publishing.test.ts
      - name: Stage 13 Performance gate
        run: node --import tsx --test test/performance.test.ts
      - name: Gemini real API integration test
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
        run: node --import tsx --test test/gemini.integration.test.ts
      - name: Upload rendered MP4 test artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-render-test
          path: /tmp/commerca-production-*/final.mp4
          if-no-files-found: ignore
