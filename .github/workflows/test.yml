name: COMMERCA Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm install
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Verify FFmpeg
        run: ffmpeg -version
      - name: Core tests (no external providers)
        run: npm test
      - name: Stage 10 Production real MP4 render test
        if: success()
        run: npm run test:production
      - name: Stage 11 QC real MP4 gate
        if: success()
        run: npm run test:qc
      - name: Stage 12 Publishing gate
        if: success()
        run: npm run test:publishing
      - name: Final Content Package E2E artifact test
        if: success()
        run: npm run test:final-package
      - name: Stage 13 Performance gate
        if: success()
        run: npm run test:performance
      - name: Stage 14 Decision and Learning gate
        if: success()
        run: npm run test:decision
      - name: Gemini real API integration test
        if: success() && env.GEMINI_API_KEY != ''
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run test:gemini
      - name: Assemble post-ready package
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/commerca-publish-package
          mkdir -p /tmp/commerca-publish-package
          cp /tmp/commerca-final-package/final-content-package.json /tmp/commerca-publish-package/final-content-package.json
          if [ -f /tmp/commerca-final-package/post.txt ]; then
            cp /tmp/commerca-final-package/post.txt /tmp/commerca-publish-package/post.txt
          fi
          mp4="$(find /tmp -type f -path '*/commerca-production-*/final.mp4' -print -quit)"
          test -n "$mp4"
          cp "$mp4" /tmp/commerca-publish-package/final.mp4
      - name: Upload final content package
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: final-content-package
          path: /tmp/commerca-final-package/final-content-package.json
          if-no-files-found: error
      - name: Upload rendered MP4 test artifact
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: production-render-test
          path: /tmp/commerca-production-*/final.mp4
          if-no-files-found: error
      - name: Upload POST READY package
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: publish-package
          path: /tmp/commerca-publish-package
          if-no-files-found: error
